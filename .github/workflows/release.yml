name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (for example v1.8.0-plus.2)
        required: true
        type: string
      publish:
        description: Publish a public GitHub Release after all builds pass
        required: true
        default: false
        type: boolean

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

concurrency:
  group: release-${{ github.ref }}-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      HAS_ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
      - name: Prepare artifact metadata
        run: |
          safe_tag="$(printf '%s' "$RELEASE_TAG" | sed -E 's/[^A-Za-z0-9._-]+/-/g; s/^-+//; s/-+$//')"
          test -n "$safe_tag" || safe_tag=test
          echo "ARTIFACT_TAG=$safe_tag" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.0
          channel: stable
          cache: true
      - name: Configure Android signing
        if: env.HAS_ANDROID_KEYSTORE == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Build Android ARM64 release APK
        run: flutter build apk --release --target-platform android-arm64 --split-per-abi --dart-define=APP_RELEASE_TAG=$RELEASE_TAG
      - name: Collect Android artifact
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
            "dist/LightNovelShelfPlus-${ARTIFACT_TAG}-arm64-v8a.apk"
      - uses: actions/upload-artifact@v5
        with:
          name: release-${{ env.RELEASE_TAG }}-android
          path: dist/*
          retention-days: 30

  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - name: Prepare package metadata
        run: |
          safe_tag="$(printf '%s' "$RELEASE_TAG" | sed -E 's/[^A-Za-z0-9._-]+/-/g; s/^-+//; s/-+$//')"
          test -n "$safe_tag" || safe_tag=test
          package_version="$(sed -nE 's/^version:[[:space:]]*([^+[:space:]]+).*/\1/p' pubspec.yaml | head -n1)"
          test -n "$package_version"
          echo "ARTIFACT_TAG=$safe_tag" >> "$GITHUB_ENV"
          echo "PACKAGE_VERSION=$package_version" >> "$GITHUB_ENV"
      - name: Install Linux build dependencies
        run: >
          sudo apt-get update && sudo apt-get install -y
          clang cmake ninja-build pkg-config libgtk-3-dev
          liblzma-dev libsecret-1-dev libfuse2 wget imagemagick zstd
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.0
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build linux --release --dart-define=APP_RELEASE_TAG=$RELEASE_TAG
      - name: Package Linux AppImage
        run: |
          mkdir -p dist
          mkdir -p AppDir/usr/bin AppDir/usr/share/applications AppDir/usr/share/icons/hicolor/256x256/apps
          cp -a build/linux/x64/release/bundle/. AppDir/usr/bin/
          convert assets/icon/app_icon.png -resize 256x256 \
            AppDir/usr/share/icons/hicolor/256x256/apps/lightnovel-shelf-plus.png
          identify AppDir/usr/share/icons/hicolor/256x256/apps/lightnovel-shelf-plus.png
          cat > AppDir/usr/share/applications/lightnovel-shelf-plus.desktop <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=轻书架Plus
          Exec=lightnovel_shelf_plus
          Icon=lightnovel-shelf-plus
          Categories=Office;Viewer;
          EOF
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage
          ARCH=x86_64 ./linuxdeploy-x86_64.AppImage --appimage-extract-and-run \
            --appdir AppDir \
            --desktop-file AppDir/usr/share/applications/lightnovel-shelf-plus.desktop \
            --icon-file AppDir/usr/share/icons/hicolor/256x256/apps/lightnovel-shelf-plus.png \
            --executable AppDir/usr/bin/lightnovel_shelf_plus \
            --output appimage
          generated="$(find . -maxdepth 1 -type f -name '*.AppImage' ! -name 'linuxdeploy-*' -print -quit)"
          test -n "$generated"
          mv "$generated" "dist/LightNovelShelfPlus-${ARTIFACT_TAG}-x86_64.AppImage"
      - name: Package Debian and Arch Linux installers
        run: |
          version="$PACKAGE_VERSION"
          arch_version="${version//-/_}"
          bundle="build/linux/x64/release/bundle"

          install -Dm755 "$bundle/lightnovel_shelf_plus" \
            package-root/opt/lightnovel-shelf-plus/lightnovel_shelf_plus
          cp -a "$bundle/lib" "$bundle/data" package-root/opt/lightnovel-shelf-plus/
          install -Dm644 AppDir/usr/share/applications/lightnovel-shelf-plus.desktop \
            package-root/usr/share/applications/lightnovel-shelf-plus.desktop
          install -Dm644 AppDir/usr/share/icons/hicolor/256x256/apps/lightnovel-shelf-plus.png \
            package-root/usr/share/icons/hicolor/256x256/apps/lightnovel-shelf-plus.png
          install -d package-root/usr/bin
          ln -s /opt/lightnovel-shelf-plus/lightnovel_shelf_plus \
            package-root/usr/bin/lightnovel-shelf-plus

          mkdir -p debian/DEBIAN
          cp -a package-root/. debian/
          cat > debian/DEBIAN/control <<EOF
          Package: lightnovel-shelf-plus
          Version: ${version}
          Section: utils
          Priority: optional
          Architecture: amd64
          Maintainer: LightNovelShelf Plus <81666000+Roroca-1@users.noreply.github.com>
          Depends: libgtk-3-0, libsecret-1-0, liblzma5
          Description: 轻书架Plus desktop client
          EOF
          dpkg-deb --root-owner-group --build debian \
            "dist/LightNovelShelfPlus-${ARTIFACT_TAG}-x86_64.deb"

          cp -a package-root arch-package
          installed_size="$(du -sk package-root | cut -f1)"
          cat > arch-package/.PKGINFO <<EOF
          pkgname = lightnovel-shelf-plus
          pkgbase = lightnovel-shelf-plus
          pkgver = ${arch_version}-1
          pkgdesc = 轻书架Plus desktop client
          url = https://github.com/Roroca-1/LightNovelShelf-Plus
          builddate = $(date +%s)
          packager = LightNovelShelf Plus GitHub Actions
          size = $((installed_size * 1024))
          arch = x86_64
          depend = gtk3
          depend = libsecret
          depend = xz
          EOF
          tar --zstd -cf "dist/LightNovelShelfPlus-${ARTIFACT_TAG}-x86_64.pkg.tar.zst" \
            -C arch-package .
      - uses: actions/upload-artifact@v5
        with:
          name: release-${{ env.RELEASE_TAG }}-linux
          path: dist/*
          retention-days: 30

  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - name: Prepare installer metadata
        shell: pwsh
        run: |
          $safeTag = [regex]::Replace($env:RELEASE_TAG, '[^A-Za-z0-9._-]+', '-').Trim('-')
          if ([string]::IsNullOrWhiteSpace($safeTag)) { $safeTag = 'test' }
          $versionLine = Get-Content pubspec.yaml | Where-Object { $_ -match '^version:\s*' } | Select-Object -First 1
          $packageVersion = (($versionLine -replace '^version:\s*', '') -split '\+')[0]
          if ([string]::IsNullOrWhiteSpace($packageVersion)) { throw 'Unable to read version from pubspec.yaml' }
          "ARTIFACT_TAG=$safeTag" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PACKAGE_VERSION=$packageVersion" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.0
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build windows --release --dart-define=APP_RELEASE_TAG=$env:RELEASE_TAG
      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          Invoke-WebRequest `
            -Uri 'https://raw.githubusercontent.com/jrsoftware/issrc/main/Files/Languages/ChineseSimplified.isl' `
            -OutFile 'windows\ChineseSimplified.isl'
      - name: Build Windows installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" `
            "/DAppVersion=$env:PACKAGE_VERSION" `
            "/DReleaseTag=$env:ARTIFACT_TAG" `
            "windows\installer.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v5
        with:
          name: release-${{ env.RELEASE_TAG }}-windows
          path: dist/*
          retention-days: 30

  publish:
    if: github.event_name != 'workflow_dispatch' || inputs.publish
    needs: [android, linux, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: release-${{ env.RELEASE_TAG }}-*
          merge-multiple: true
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: dist/*
