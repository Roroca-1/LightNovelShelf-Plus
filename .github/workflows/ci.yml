name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-and-android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      HAS_ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && secrets.ANDROID_KEYSTORE_PASSWORD != '' && secrets.ANDROID_KEY_ALIAS != '' && secrets.ANDROID_KEY_PASSWORD != '' }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.0
          channel: stable
          cache: true
      - name: Configure persistent Android signing
        if: env.HAS_ANDROID_KEYSTORE == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          keytool -list -keystore "$RUNNER_TEMP/release.jks" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" >/dev/null
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Build Android ARM64 test APK
        run: flutter build apk --debug --target-platform android-arm64
      - name: Verify Plus application ID
        run: |
          apk="build/app/outputs/flutter-apk/app-debug.apk"
          aapt="$(find "$ANDROID_HOME/build-tools" -type f -name aapt -print | sort -V | tail -n1)"
          test -x "$aapt"
          package_name="$($aapt dump badging "$apk" | sed -n "s/^package: name='\([^']*\)'.*/\1/p")"
          echo "APK application ID: $package_name"
          test "$package_name" = "app.lightnovel.shelf.plus"
      - uses: actions/upload-artifact@v5
        with:
          name: lightnovelshelf-plus-android-arm64-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7

  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - name: Install Linux build dependencies
        run: >
          sudo apt-get update && sudo apt-get install -y
          clang cmake ninja-build pkg-config libgtk-3-dev
          liblzma-dev libsecret-1-dev
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.0
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build linux --debug
      - name: Package Linux test build
        run: tar -C build/linux/x64/debug/bundle -czf lightnovelshelf-plus-linux-x64-debug.tar.gz .
      - uses: actions/upload-artifact@v5
        with:
          name: lightnovelshelf-plus-linux-x64-debug
          path: lightnovelshelf-plus-linux-x64-debug.tar.gz
          retention-days: 7

  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.0
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build windows --debug
      - name: Package Windows test build
        shell: pwsh
        run: >
          Compress-Archive
          -Path 'build/windows/x64/runner/Debug/*'
          -DestinationPath 'lightnovelshelf-plus-windows-x64-debug.zip'
      - uses: actions/upload-artifact@v5
        with:
          name: lightnovelshelf-plus-windows-x64-debug
          path: lightnovelshelf-plus-windows-x64-debug.zip
          retention-days: 7
